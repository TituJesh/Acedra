name: Acedra CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: testing
          SECRET_KEY: acedra-ci-test-secret-key-minimum-32-chars
          DATABASE_URL: sqlite:///:memory:
          AWS_REGION: ap-south-1
          S3_BUCKET_NAME: test-acedra-documents-bucket
        run: pytest

      - name: Build Docker image
        run: docker build -t acedra .