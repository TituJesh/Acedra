version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: acedra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acedra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acedra"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acedra_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/acedra
      SECRET_KEY: dev-local-super-secret-key-32-bytes-long!
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: acedra-documents-dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
